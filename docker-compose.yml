version: "3.9"
services:
  backend:
    image: maven:3.9.16-eclipse-temurin-25
    working_dir: /app/backend
    volumes:
      - ./:/app
    ports:
      - "8080:8080"
    command: mvn spring-boot:run

  frontend:
    image: node:18-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
